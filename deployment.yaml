apiVersion: apps/v1
kind: Deployment
metadata:
  name: seleniumdemo-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: seleniumdemo
  template:
    metadata:
      labels:
        app: seleniumdemo
    spec:
      containers:
        - name: seleniumdemo
          image: eddulapreethi/simple_demo:seleniumimage # use your Docker Hub image
          ports:
            - containerPort: 5000
